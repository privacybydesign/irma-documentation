<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="878" height="358" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="440" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">App attestation: one idea, several backends</text>
  <text x="440" y="64" text-anchor="middle" font-size="13" fill="#64748b">Every backend answers the same question, rooted in a trust anchor an attacker cannot forge</text>

  <!-- Three backend cards -->
  <rect x="40" y="96" width="250" height="86" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="165" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Apple App Attest</text>
  <text x="165" y="150" text-anchor="middle" font-size="12" fill="#475569">iOS, rooted in the</text>
  <text x="165" y="167" text-anchor="middle" font-size="12" fill="#475569">Apple App Attest root</text>

  <rect x="315" y="96" width="250" height="86" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="440" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Google Play Integrity</text>
  <text x="440" y="150" text-anchor="middle" font-size="12" fill="#475569">Android with Google,</text>
  <text x="440" y="167" text-anchor="middle" font-size="12" fill="#475569">verified with Play Console keys</text>

  <rect x="590" y="96" width="250" height="86" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="715" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Open variant</text>
  <text x="715" y="144" text-anchor="middle" font-size="12" fill="#475569">phones without Google</text>
  <text x="715" y="161" text-anchor="middle" font-size="12" fill="#475569">or Apple: a provider PKI</text>

  <!-- Converging question box -->
  <rect x="250" y="272" width="380" height="66" rx="10" fill="#7c3aed"/>
  <text x="440" y="300" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Is this a genuine, unmodified app?</text>
  <text x="440" y="322" text-anchor="middle" font-size="11" fill="#ede9fe">the evidence that feeds the Wallet Instance Attestation</text>

  <!-- Arrows converge -->
  <path d="M165 182 L165 240 L360 240 L410 270" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="440" y1="182" x2="440" y2="270" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow2)"/>
  <path d="M715 182 L715 240 L520 240 L470 270" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow2)"/>
</svg>
