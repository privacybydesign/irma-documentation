<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 414" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="878" height="412" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="440" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Two employee credentials, both valid</text>
  <text x="440" y="64" text-anchor="middle" font-size="13" fill="#64748b">Same type, same employer. Nothing inside either one says whether Finance is still current.</text>

  <!-- Old employee credential -->
  <rect x="48" y="92" width="368" height="152" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="72" y="120" font-size="11" font-weight="600" letter-spacing="1.1" fill="#64748b">EMPLOYEE &#183; EXAMPLE CORP</text>
  <text x="72" y="154" font-size="20" font-weight="700" fill="#0f172a">Finance</text>
  <text x="72" y="176" font-size="12.5" fill="#64748b">your former department</text>
  <rect x="72" y="196" width="74" height="24" rx="12" fill="#e7f6ee" stroke="#2e9e6b" stroke-width="1.2"/>
  <text x="109" y="212" text-anchor="middle" font-size="11.5" font-weight="600" fill="#14532d">signed</text>
  <rect x="154" y="196" width="94" height="24" rx="12" fill="#e7f6ee" stroke="#2e9e6b" stroke-width="1.2"/>
  <text x="201" y="212" text-anchor="middle" font-size="11.5" font-weight="600" fill="#14532d">unexpired</text>
  <rect x="256" y="196" width="104" height="24" rx="12" fill="#e7f6ee" stroke="#2e9e6b" stroke-width="1.2"/>
  <text x="308" y="212" text-anchor="middle" font-size="11.5" font-weight="600" fill="#14532d">not revoked</text>

  <!-- New employee credential -->
  <rect x="464" y="92" width="368" height="152" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="488" y="120" font-size="11" font-weight="600" letter-spacing="1.1" fill="#64748b">EMPLOYEE &#183; EXAMPLE CORP</text>
  <text x="488" y="154" font-size="20" font-weight="700" fill="#0f172a">Legal</text>
  <text x="488" y="176" font-size="12.5" fill="#64748b">your current department</text>
  <rect x="488" y="196" width="74" height="24" rx="12" fill="#e7f6ee" stroke="#2e9e6b" stroke-width="1.2"/>
  <text x="525" y="212" text-anchor="middle" font-size="11.5" font-weight="600" fill="#14532d">signed</text>
  <rect x="570" y="196" width="94" height="24" rx="12" fill="#e7f6ee" stroke="#2e9e6b" stroke-width="1.2"/>
  <text x="617" y="212" text-anchor="middle" font-size="11.5" font-weight="600" fill="#14532d">unexpired</text>
  <rect x="672" y="196" width="104" height="24" rx="12" fill="#e7f6ee" stroke="#2e9e6b" stroke-width="1.2"/>
  <text x="724" y="212" text-anchor="middle" font-size="11.5" font-weight="600" fill="#14532d">not revoked</text>

  <!-- Verifier request -->
  <text x="440" y="274" text-anchor="middle" font-size="13" fill="#475569">Verifier asks: which department do you work in?</text>
  <path d="M232 250 L344 294" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M648 250 L536 294" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="252" y="296" width="376" height="48" rx="10" fill="#fdf3e3" stroke="#d99a2b" stroke-width="1.5"/>
  <text x="440" y="318" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7c4a03">Both can be offered as valid answers</text>
  <text x="440" y="336" text-anchor="middle" font-size="12" fill="#475569">and you are asked to choose</text>

  <!-- Verdict -->
  <rect x="48" y="356" width="784" height="46" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="440" y="376" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Of the three checks, only revocation is the provider's to change after issuance.</text>
  <text x="440" y="394" text-anchor="middle" font-size="12.5" fill="#475569">Until the employer revokes the old credential, the wallet has no reason to suppress Finance.</text>
</svg>
