<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="878" height="408" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="440" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">One card, several signed copies</text>
  <text x="440" y="64" text-anchor="middle" font-size="13" fill="#64748b">What you see, and what the wallet stores behind it</text>

  <!-- Logical credential -->
  <rect x="48" y="96" width="316" height="168" rx="12" fill="#eaf1fb" stroke="#3b6fd4" stroke-width="1.5"/>
  <text x="70" y="124" font-size="11" font-weight="600" letter-spacing="1.1" fill="#1e3a8a">LOGICAL CREDENTIAL</text>
  <text x="70" y="156" font-size="12.5" fill="#64748b">type</text>
  <text x="150" y="156" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0f172a">com.example.employee</text>
  <text x="70" y="184" font-size="12.5" fill="#64748b">issuer</text>
  <text x="150" y="184" font-size="12.5" fill="#0f172a">Example Corp</text>
  <text x="70" y="212" font-size="12.5" fill="#64748b">department</text>
  <text x="150" y="212" font-size="12.5" font-weight="600" fill="#0f172a">Legal</text>
  <text x="70" y="246" font-size="12" fill="#64748b" font-style="italic">the single card you see</text>

  <path d="M372 180 L420 180" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Technical copies, stacked -->
  <rect x="490" y="100" width="252" height="140" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <rect x="482" y="108" width="252" height="140" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <rect x="474" y="116" width="252" height="140" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <rect x="466" y="124" width="252" height="140" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <text x="486" y="150" font-size="11" font-weight="600" letter-spacing="1.1" fill="#475569">TECHNICAL COPY 1 OF 4</text>
  <text x="486" y="180" font-size="12" fill="#64748b">salt</text>
  <text x="574" y="180" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0f172a">9f2a1c&#8230;</text>
  <text x="486" y="204" font-size="12" fill="#64748b">holder key</text>
  <text x="574" y="204" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0f172a">a14c7b&#8230;</text>
  <text x="486" y="228" font-size="12" fill="#64748b">signature</text>
  <text x="574" y="228" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0f172a">7e08d3&#8230;</text>
  <text x="486" y="252" font-size="12" fill="#64748b">valid until</text>
  <text x="574" y="252" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0f172a">12 Oct 2026</text>
  <text x="592" y="284" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">several signed copies, one statement</text>

  <!-- What is hashed, what is not -->
  <rect x="48" y="298" width="380" height="98" rx="10" fill="#e7f6ee" stroke="#2e9e6b" stroke-width="1.5"/>
  <text x="70" y="324" font-size="13.5" font-weight="700" fill="#14532d">Identical in every copy</text>
  <text x="70" y="348" font-size="12.5" fill="#475569">type &#183; issuer &#183; attribute values</text>
  <text x="70" y="386" font-size="12.5" font-weight="600" fill="#1c6b58">&#8594; the three inputs Yivi hashes</text>

  <rect x="452" y="298" width="380" height="98" rx="10" fill="#fdf3e3" stroke="#d99a2b" stroke-width="1.5"/>
  <text x="474" y="324" font-size="13.5" font-weight="700" fill="#7c4a03">Different in every copy</text>
  <text x="474" y="348" font-size="12.5" fill="#475569">salts &#183; digests &#183; holder keys</text>
  <text x="474" y="366" font-size="12.5" fill="#475569">signatures &#183; validity timestamps</text>
  <text x="474" y="386" font-size="12.5" font-weight="600" fill="#a3701c">&#8594; omitted from the hash</text>
</svg>
